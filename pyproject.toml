[project]
name = "feilian-rag"
version = "0.1.0"
description = "飞链 RAG：本地优先、带证据链的文档检索问答工具"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FeinaoLab" }]
keywords = ["rag", "langchain", "chroma", "ollama", "retrieval-augmented-generation"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "langchain>=1.0,<2.0",
  "langchain-core>=1.0,<2.0",
  "langchain-text-splitters>=1.0,<2.0",
  "langchain-community>=0.4,<1.0",
  "langchain-chroma>=0.2,<1.0",
  "chromadb>=0.5,<2.0",
  "python-dotenv>=1.0",
  "pypdf>=4.0",
  "python-docx>=1.1",
]

[project.optional-dependencies]
ollama = ["langchain-ollama>=1.0,<2.0"]
openai = ["langchain-openai>=1.0,<2.0"]
dev = ["pytest>=8.0"]

[project.scripts]
feilian = "feilian.cli:main"

[project.urls]
Homepage = "https://github.com/FeinaoLab/feilian-rag"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["feilian*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
